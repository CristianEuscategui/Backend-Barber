spring.application.name=backend
server.port=${PORT:8080}

# Configuración de PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/barberdb}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Eb&09}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# Logs: en desarrollo puedes subirlos a DEBUG manualmente si los necesitas
logging.level.org.springframework.web=INFO
logging.level.com.barberpro.backend=INFO

app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.jwt.secret=${JWT_SECRET:CambiaEstaClavePorAlgoLargoYSecretoParaProduccion123456789}
app.jwt.expiration-ms=86400000

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}